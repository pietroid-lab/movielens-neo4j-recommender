name: Publish MovieLens recommender

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap_chunks/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/movie-recommender.zip
          unzip -tq /tmp/movie-recommender.zip
          mkdir -p /tmp/movie-recommender
          unzip -q /tmp/movie-recommender.zip -d /tmp/movie-recommender
          test -f /tmp/movie-recommender/movie-recommender-neo4j/README.md
          cp -a /tmp/movie-recommender/movie-recommender-neo4j/. .
          rm -rf bootstrap_chunks
          rm -rf /tmp/movie-recommender
          rm -f /tmp/movie-recommender.zip
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit project sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish MovieLens Neo4j recommender"
          git push
